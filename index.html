<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glasses Maps</title>
<style>
:root{
  color-scheme:dark;
  --ac:#9be8c8;                       /* soft mint accent */
  --txt:#fff;--mut:rgba(255,255,255,.62);
  --glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.15);
  --edge:rgba(255,255,255,.18);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Pure black = transparent on a see-through lens, so keep the page black and let glass float on it */
html,body{margin:0;height:100%;background:#000;color:var(--txt);
  font:500 20px/1.25 -apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  letter-spacing:.1px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}
.hide{display:none!important}

.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid var(--edge);border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 28px rgba(0,0,0,.45);
}

input,button{font:inherit;color:var(--txt);border:1px solid var(--edge);border-radius:999px;padding:12px 18px;
  background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:background .15s,transform .1s,box-shadow .15s}
input{width:100%;background:rgba(255,255,255,.07)}
input::placeholder{color:var(--mut)}
button:active{transform:scale(.97);background:var(--glass2)}
button:focus,input:focus{outline:none;border-color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px rgba(255,255,255,.35)}
button.pri{background:rgba(255,255,255,.92);color:#000;border-color:transparent;font-weight:650}
button.pri:active{background:#fff}

#setup{padding:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
#results{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:46vh}
#results button{text-align:left;font-size:17px;border-radius:20px}

#statusrow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px}
#status{color:var(--mut);font-size:15px;line-height:1.2;flex:1}
#gpsretry{font-size:14px;padding:8px 14px;flex:none}

#nav{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
#top{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px}
#arrow{width:76px;height:76px;flex:none;filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}
#dist{font-size:46px;font-weight:700;color:var(--txt);line-height:1;letter-spacing:-.5px}
#instr{font-size:20px;color:var(--mut);margin-top:2px}
#map{flex:1;width:100%;min-height:0;border-radius:var(--r);border:1px solid var(--edge);
  background:radial-gradient(120% 90% at 50% 100%,rgba(255,255,255,.10),rgba(255,255,255,.02));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
#foot{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:17px;
  padding:8px 8px 8px 20px;border-radius:999px}
</style>
</head>
<body>
<div id="app">
  <div id="setup" class="glass">
    <input id="q" placeholder="Where to?" autocomplete="off">
    <div class="row" style="margin-top:8px">
      <button id="mode" type="button">Walk</button>
      <button id="go" class="pri" type="button">Search</button>
    </div>
    <div id="results" style="margin-top:8px"></div>
  </div>
  <div id="statusrow" class="glass">
    <div id="status">Waiting for GPS…</div>
    <button id="gpsretry" type="button">Retry GPS</button>
  </div>
  <div id="nav" class="hide">
    <div id="top" class="glass">
      <svg id="arrow" viewBox="-50 -50 100 100"><g id="ag"><path d="M0-40 L28 0 H10 V38 H-10 V0 H-28Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></g></svg>
      <div><div id="dist">–</div><div id="instr"></div></div>
    </div>
    <canvas id="map"></canvas>
    <div id="foot" class="glass"><span id="rem"></span><button id="stop" type="button">End</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const R=6371000,rad=d=>d*Math.PI/180;
const imperial=(navigator.language||'').startsWith('en-US');
const MODES=[{k:'foot',label:'Walk',url:'routed-foot/route/v1/foot',scale:.6},
             {k:'car',label:'Drive',url:'routed-car/route/v1/driving',scale:.12},
             {k:'bike',label:'Bike',url:'routed-bike/route/v1/bike',scale:.3}];
let mi=0,pos=null,last=null,heading=0,route=null,steps=[],si=0,lastCheck=0,dest=null,arrived=false,lastSpoken=-1,watchId=null;

function setStatus(t){$('status').textContent=t;}

function dist(a,b){const dl=rad(b[1]-a[1]),dn=rad(b[0]-a[0]);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function bearing(a,b){const y=Math.sin(rad(b[0]-a[0]))*Math.cos(rad(b[1])),
  x=Math.cos(rad(a[1]))*Math.sin(rad(b[1]))-Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*Math.cos(rad(b[0]-a[0]));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;}
function toXY(p,o){return[(p[0]-o[0])*Math.cos(rad(o[1]))*111320,(p[1]-o[1])*110540];}
function fmtD(m){
  if(imperial){const ft=m*3.281;return ft<900?Math.round(ft/10)*10+' ft':(m/1609.34).toFixed(1)+' mi';}
  return m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';}
function offRoute(){
  const pts=route.geometry.coordinates;let best=Infinity;
  for(let i=0;i<pts.length-1;i++){
    const a=toXY(pts[i],pos),b=toXY(pts[i+1],pos),dx=b[0]-a[0],dy=b[1]-a[1];
    const l2=dx*dx+dy*dy;let t=l2?-(a[0]*dx+a[1]*dy)/l2:0;t=Math.max(0,Math.min(1,t));
    best=Math.min(best,Math.hypot(a[0]+t*dx,a[1]+t*dy));}
  return best;}

function text(s){
  const m=s.maneuver,t=m.type,mod=m.modifier||'',n=s.name?' onto '+s.name:'';
  if(t==='arrive')return 'Arrive at destination';
  if(t==='depart')return 'Head '+(s.name?'on '+s.name:'out');
  if(t==='roundabout'||t==='rotary')return 'Roundabout, exit '+(m.exit||'')+n;
  if(mod==='uturn')return 'Make a U-turn'+n;
  if(t==='continue'||mod==='straight')return 'Continue straight'+(s.name?' on '+s.name:'');
  return 'Turn '+mod+n;}
function angle(s){
  const m=s.maneuver;
  return ({'sharp left':-135,'left':-90,'slight left':-45,'straight':0,'slight right':45,'right':90,'sharp right':135,'uturn':180})[m.modifier]??0;}

/* ---------- GPS ---------- */
function gpsError(e){
  if(e&&e.code===1)setStatus('Location denied. Allow it in your browser/site settings (and Meta AI app location), then tap Retry GPS.');
  else if(e&&e.code===3)setStatus('GPS timed out. Go near a window or outside, then tap Retry GPS.');
  else setStatus('GPS unavailable ('+((e&&e.message)||'unknown')+'). Tap Retry GPS.');
}
function startGPS(){
  if(!navigator.geolocation){setStatus('This browser has no location support.');return;}
  if(!window.isSecureContext){setStatus('Location needs HTTPS. Open the https:// link.');return;}
  setStatus('Waiting for GPS…');
  if(watchId!==null){try{navigator.geolocation.clearWatch(watchId);}catch(e){}watchId=null;}
  // Quick coarse fix first (wifi/cell), then refine with high accuracy.
  navigator.geolocation.getCurrentPosition(onPos,gpsError,
    {enableHighAccuracy:false,maximumAge:120000,timeout:15000});
  watchId=navigator.geolocation.watchPosition(onPos,
    e=>{if(!pos)gpsError(e);},
    {enableHighAccuracy:true,maximumAge:2000,timeout:60000});
}
function getFixOnce(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej({message:'no geolocation'});
    navigator.geolocation.getCurrentPosition(p=>{onPos(p);res();},rej,
      {enableHighAccuracy:false,maximumAge:120000,timeout:15000});
  });
}
function onPos(p){
  const c=[p.coords.longitude,p.coords.latitude];
  if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>1)heading=p.coords.heading;
  else if(last&&dist(last,c)>4)heading=bearing(last,c);
  if(!last||dist(last,c)>4)last=c;
  pos=c;
  if(route)update();
  else{const t=$('status').textContent;if(t.startsWith('Waiting')||t.startsWith('Location')||t.startsWith('GPS'))setStatus('GPS ready');}
}

/* ---------- search & routing ---------- */
async function search(){
  const q=$('q').value.trim();if(!q)return;
  $('results').innerHTML='';setStatus('Searching…');
  let u='https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q);
  if(pos)u+='&viewbox='+[pos[0]-.5,pos[1]+.5,pos[0]+.5,pos[1]-.5].join(',');
  try{
    const r=await (await fetch(u)).json();
    if(!r.length){setStatus('No results');return;}
    setStatus(pos?'GPS ready':'Waiting for GPS…');
    r.forEach(x=>{const b=document.createElement('button');b.type='button';
      b.textContent=x.display_name.split(',').slice(0,3).join(',');
      b.onclick=()=>start([+x.lon,+x.lat]);$('results').appendChild(b);});
    $('results').firstChild.focus();
  }catch(e){setStatus('Search failed');}
}

async function start(d){
  dest=d;
  if(!pos){
    setStatus('Getting your location…');
    try{await getFixOnce();}
    catch(e){gpsError(e);return;}
  }
  setStatus('Routing…');
  const m=MODES[mi];
  const u='https://routing.openstreetmap.de/'+m.url+'/'+pos.join(',')+';'+d.join(',')+'?steps=true&overview=full&geometries=geojson';
  try{
    const r=await (await fetch(u)).json();
    if(!r.routes||!r.routes.length){setStatus('No route found');return;}
    route=r.routes[0];steps=route.legs[0].steps;si=0;arrived=false;lastSpoken=-1;
    $('setup').classList.add('hide');$('statusrow').classList.add('hide');$('nav').classList.remove('hide');
    try{navigator.wakeLock&&navigator.wakeLock.request('screen');}catch(e){}
    update();
  }catch(e){setStatus('Routing failed');}
}

function update(){
  if(!route||!pos)return;
  const nxt=steps[si+1];
  if(nxt){
    const d=dist(pos,nxt.maneuver.location);
    if(d<(MODES[mi].k==='car'?35:20)){
      if(nxt.maneuver.type==='arrive'){arrived=true;}
      else{si++;}
    }
  }
  const n=steps[si+1]||steps[si];
  const d=dist(pos,n.maneuver.location);
  let remain=d;for(let j=si+1;j<steps.length;j++)remain+=steps[j].distance;
  const eta=Math.max(1,Math.round(route.duration*remain/route.distance/60));
  const msg=arrived?'You have arrived':text(n);
  $('dist').textContent=arrived?'✓':fmtD(d);
  $('instr').textContent=msg;
  $('ag').setAttribute('transform','rotate('+(arrived?0:angle(n))+')');
  $('rem').textContent=fmtD(remain)+' · '+eta+' min';
  if(lastSpoken!==si&&'speechSynthesis' in window){
    lastSpoken=si;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(msg));}catch(e){}}
  const now=Date.now();
  if(!arrived&&now-lastCheck>6000){lastCheck=now;if(offRoute()>70)start(dest);}
  draw();
}

function draw(){
  const c=$('map');if(!c.clientWidth||!pos)return;
  const dpr=window.devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);
  const w=c.clientWidth,h=c.clientHeight,cx=w/2,cy=h*.72,s=MODES[mi].scale,th=rad(heading);
  const P=p=>{const[x,y]=toXY(p,pos);return[cx+(x*Math.cos(th)-y*Math.sin(th))*s,cy-(x*Math.sin(th)+y*Math.cos(th))*s];};
  g.lineCap=g.lineJoin='round';
  if(route){
    g.strokeStyle='#9be8c8';g.lineWidth=8;g.shadowColor='rgba(155,232,200,.7)';g.shadowBlur=14;g.beginPath();
    route.geometry.coordinates.forEach((p,i)=>{const q=P(p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);});
    g.stroke();g.shadowBlur=0;
    const n=steps[si+1];
    if(n){const q=P(n.maneuver.location);
      g.fillStyle='rgba(255,255,255,.25)';g.beginPath();g.arc(q[0],q[1],13,0,7);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(q[0],q[1],6,0,7);g.fill();}
  }
  g.shadowColor='rgba(255,255,255,.6)';g.shadowBlur=12;
  g.fillStyle='#fff';g.beginPath();g.moveTo(cx,cy-16);g.lineTo(cx+11,cy+10);g.lineTo(cx-11,cy+10);g.closePath();g.fill();g.shadowBlur=0;
}

/* ---------- UI ---------- */
$('mode').onclick=()=>{mi=(mi+1)%MODES.length;$('mode').textContent=MODES[mi].label;};
$('go').onclick=search;
$('gpsretry').onclick=startGPS;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
$('stop').onclick=()=>{route=null;steps=[];try{speechSynthesis.cancel();}catch(e){}
  $('nav').classList.add('hide');$('setup').classList.remove('hide');$('statusrow').classList.remove('hide');
  setStatus(pos?'GPS ready':'Waiting for GPS…');};
addEventListener('resize',draw);

startGPS();

// Deep links: ?q=coffee  or  ?to=lat,lon&mode=car|foot|bike
const qs=new URLSearchParams(location.search);
const wantMode=MODES.findIndex(m=>m.k===qs.get('mode'));if(wantMode>=0){mi=wantMode;$('mode').textContent=MODES[mi].label;}
if(qs.get('q')){$('q').value=qs.get('q');}
if(qs.get('to')){const[a,b]=qs.get('to').split(',').map(Number);
  const t=setInterval(()=>{if(pos){clearInterval(t);start([b,a]);}},500);}
else if(qs.get('q')){const t=setInterval(()=>{if(pos){clearInterval(t);search();}},500);}
</script>
</body>
</html>
